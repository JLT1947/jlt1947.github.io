         <p id="noframes">
This <b>genealogy report</b> is about <i>JL TANCERMAN - Lopata family tree </i>.It contains 246 individuals and 91 families from the family tree. This is the LOPATA portion of my family tree. It was initially compiled on paper in 1961 with my grandfather Albert (Abraham) LOPATA, and I&#39;ve erratically maintained it through the past 45 years or so, with the help of cousins over 3 continents. It is however incomplete, as the family has branched out exponentially through 4 or even 5 generations since then, and I would deeply appreciate all relevant input regarding family members past and present: names, dates of birth, etc. Hope you enjoy this genealogy in its present state. <br /><br />Note: click the Menu symbol at top left (3 horizontal bars) and choose the genealogy &quot;view&quot; you want : the graphical TREE view is best suited with a computer or tablet, other views are ok with a phone. You can zoom, pan, drag the graphical tree for exploring, and click all items (names, links) for more details. Enjoy ! <br /><br />Your comments are welcome, as always.<br />Jean-Louis Tancerman<br />jltancerman@outlook.fr <br /><br /></p><ul>
