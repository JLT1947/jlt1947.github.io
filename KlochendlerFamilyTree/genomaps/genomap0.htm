						document.getElementById("arrow").classList.remove("icon-down");
						document.getElementById("arrow").classList.add("icon-up");
					}

				var ul = document.getElementById('layerList');

				for (var i=0; i<layers.length-1; i++) {
					li = document.createElement("li");
					layer = layers[i];
					var checked = layersHidden.indexOf('"'+layer+'"') > -1 ? 'checked' : '';
					li.innerHTML = '<label><input type="checkbox" ' + checked + 'checked onchange="toggleLayer(\'' + layer + '\');"/>' + layers[i]+'</label>';
					ul.appendChild(li); 
				}
				
				layersHidden.replace(/""/g,'"').split('"').forEach(function(layer){toggleLayer(layer);});
				document.getElementById('layerControl').style.display='inline';
			}
		});
		// the only postMessage we get is one to reload popup.htm. current dir is genomaps so need to look in parent dir.
		$.receiveMessage(function(e){
			window.location.assign('../'+e.data);
		});
		function toggleLayer(layer) {
			if (layer != '') {
				var layerClass = layer.replace(/ /g,'__').replace('|',' ');
				hiddenLayers.toggle(layerClass);
				var dsp = document.querySelector('.'+ layerClass).style.display;
				var nodeList = document.querySelectorAll('.' + layerClass);
				for (let i = 0; i < nodeList.length; i++) {
					var hidden = true;
					nodeList[i].classList.forEach(
						function(token,index) {
							if (!hiddenLayers.contains(token)) hidden = false;
						}
					);
					nodeList[i].style.display = hidden ? 'none' : 'inline';
				}
			}
		}
